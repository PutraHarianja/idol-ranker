version: 2
updates:
  # target-branch = the current release branch. Update it in each "Bump version" PR.
  - package-ecosystem: npm
    directory: /
    target-branch: release/1.3.0
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/1.3.0
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
